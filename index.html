<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>House Making Cost Calculation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22272e">
<link rel="icon" href="icon-192.png">
<style>

:root{--sw:270px;--bg:#22272e;--panel:#2d333b;--panel2:#373e47;--text:#e6edf3;--muted:#9aa7b4;--accent:#4c9aff;--accent2:#2f6fd1;--bd:#444c56;--th:#1f4d8f;--thtx:#fff;--zebra:rgba(255,255,255,.035);--side:#1b1f26;--danger:#e5534b;--ok:#3fb950}
[data-theme=light]{--bg:#f3f5f9;--panel:#fff;--panel2:#eef1f6;--text:#1c2430;--muted:#5c6b7a;--accent:#2563eb;--accent2:#1d4ed8;--bd:#d5dbe5;--th:#2a5db0;--zebra:rgba(0,0,0,.03);--side:#e9edf5}
[data-theme=navy]{--bg:#0a1a3f;--panel:#12295c;--panel2:#193672;--text:#e8eeff;--muted:#9db3e0;--accent:#5aa2ff;--accent2:#2f7fe0;--bd:#2b4585;--th:#0a3a8f;--side:#071431}
[data-theme=sky]{--bg:#d9f0fb;--panel:#f3fbff;--panel2:#e1f3fc;--text:#0c3550;--muted:#4c748c;--accent:#0288d1;--accent2:#0277bd;--bd:#a9d6ec;--th:#0a78b5;--zebra:rgba(2,136,209,.06);--side:#c4e5f6}
[data-theme=gray]{--bg:#e3e5e8;--panel:#f3f4f6;--panel2:#e6e8ec;--text:#23272d;--muted:#5b626c;--accent:#4b5563;--accent2:#374151;--bd:#c6cbd2;--th:#4b5563;--zebra:rgba(0,0,0,.035);--side:#d3d6db}
[data-theme=violet]{--bg:linear-gradient(135deg,#27389a 0%,#5b34a8 55%,#7a2fa0 100%);--panel:rgba(28,20,88,.55);--panel2:rgba(255,255,255,.12);--text:#fff;--muted:#cfc6ff;--accent:#b9a4ff;--accent2:#8f74f0;--bd:rgba(255,255,255,.25);--th:rgba(20,14,80,.85);--zebra:rgba(255,255,255,.05);--side:rgba(14,10,60,.7)}
[data-theme=teal]{--bg:#0f2e2e;--panel:#164242;--panel2:#1d5656;--text:#e6fbfa;--muted:#9fd9d4;--accent:#2dd4bf;--accent2:#14b8a6;--bd:#2a6363;--th:#0f6b61;--side:#0a2424}
[data-theme=rose]{--bg:#2e1420;--panel:#3d1b2c;--panel2:#4d2238;--text:#ffe9f1;--muted:#e0a8bd;--accent:#f472b6;--accent2:#db2777;--bd:#5c2a42;--th:#9d2962;--side:#230f19}
[data-theme=forest]{--bg:#122414;--panel:#1a331d;--panel2:#204126;--text:#e7f6e9;--muted:#a6cdae;--accent:#4ade80;--accent2:#22c55e;--bd:#2a4a2f;--th:#1f7a3d;--side:#0d1c0f}
[data-theme=amber]{--bg:#2b1d08;--panel:#3a280d;--panel2:#4a3412;--text:#fff3dc;--muted:#e0bd86;--accent:#fbbf24;--accent2:#f59e0b;--bd:#5c4318;--th:#b4760f;--side:#201405}
[data-theme=slate]{--bg:#1e2230;--panel:#282d3f;--panel2:#333a50;--text:#e8ecff;--muted:#a6afcf;--accent:#818cf8;--accent2:#6366f1;--bd:#3c4463;--th:#4338ca;--side:#171a26}
[data-theme=peach]{--bg:#fff1e6;--panel:#ffffff;--panel2:#ffe4cf;--text:#4a2d1c;--muted:#9c6f52;--accent:#fb923c;--accent2:#ea580c;--bd:#f3c9a3;--th:#f0822f;--zebra:rgba(251,146,60,.06);--side:#ffe0c7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans Bengali","Hind Siliguri","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);background-attachment:fixed;color:var(--text);font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--side);border-right:1px solid var(--bd);z-index:30;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s}
body.sb-open #side{transform:none}
#main{margin-left:0;transition:margin .25s;min-height:100vh}
body.sb-open #main{margin-left:var(--sw)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;font-size:20px;font-weight:700}
.sh button{background:none;border:1px solid var(--bd);border-radius:8px;cursor:pointer;padding:2px 10px;font-size:20px}
#side nav{flex:1;overflow:auto;padding:6px 10px}
.ni{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 12px;border-radius:12px;margin-bottom:6px;cursor:pointer;font-size:19px;line-height:1.25;border:1px solid transparent}
.ni:hover{background:var(--panel2)}
.ni.on{background:var(--accent);color:#fff;font-weight:700}
.ni .nt{flex:1;word-break:break-word}
.ni .ed{background:none;border:none;cursor:pointer;opacity:.55;font-size:16px;padding:4px}
.ni .ed:hover{opacity:1}
.ein{width:100%;font-size:18px;padding:4px 8px;border-radius:8px;border:2px solid var(--accent);background:var(--panel);color:var(--text)}
.swd{padding:12px 16px 18px;border-top:1px solid var(--bd);font-size:14px;color:var(--muted)}
.swd input{width:100%}
#rs{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize}
#rs:hover{background:var(--accent);opacity:.5}
#bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
#top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px;padding:8px 14px 10px;position:relative;z-index:20;background:var(--panel);border-bottom:1px solid var(--bd)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ib{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-size:22px;width:44px;height:44px;display:grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.prof{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);object-fit:cover;cursor:pointer;display:grid;place-items:center;font-size:22px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
#pn{background:transparent;border:1px dashed transparent;border-radius:8px;padding:6px 8px;width:90px;max-width:55vw;font-weight:600;font-size:17px;white-space:nowrap}
#pn:hover,#pn:focus{border-color:var(--accent);outline:none}
#page{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
#page.catp{padding-left:96px}
.tb{text-align:center;margin:0;min-width:0}
.tb h1{margin:0;font-size:clamp(14px,2.6vw,28px);letter-spacing:.5px;font-weight:800;outline:none;cursor:text;border-radius:6px;padding:0 4px;display:inline-block}
.tb h1:hover,.tb h1:focus{background:rgba(255,255,255,.08)}
.hsub{font-size:clamp(13px,1.8vw,17px);color:var(--accent);margin-top:4px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hsub span{outline:none;cursor:text;border-radius:4px;padding:0 3px}
.hsub span:hover,.hsub span:focus{background:rgba(255,255,255,.08)}
.hsub .dot{color:var(--muted)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.cbtn{padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--panel);cursor:pointer;font-size:18px;font-weight:600;text-align:center}
.cbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.grand{background:var(--accent);color:#fff;border-radius:16px;padding:16px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:20px;font-weight:700}
.grand b{font-size:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cards.sub{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card,.scard{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:18px}
.card{cursor:pointer}.card:hover,.scard:hover{border-color:var(--accent)}
.scard{cursor:pointer;min-height:150px}
.card h3,.scard h3{margin:0 0 12px;font-size:20px}
.st{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--bd);font-size:17px}
.st span{color:var(--muted)}.st b{font-variant-numeric:tabular-nums}
.st.big b{font-size:21px;color:var(--accent)}
.chips{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.6}
.ptitle{font-size:26px;margin:0 0 16px}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lhead h2{margin:0;font-size:22px}
.btn{border:1px solid var(--bd);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dan{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.bx{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;text-align:center}
.bx small{display:block;color:var(--muted);font-size:15px;margin-bottom:4px}
.bx b{font-size:21px;word-break:break-word}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sf{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.sf label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
.sf #q{width:220px}.sf input[type=date]{width:auto}
.acts{display:flex;gap:8px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--panel);max-height:calc(100vh - 300px);min-height:220px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th{background:var(--th);color:var(--thtx,#fff);font-size:16.5px;font-weight:700;line-height:1.25;padding:12px 10px;text-align:center;vertical-align:middle;position:sticky;top:0;z-index:2;border-right:1px solid rgba(255,255,255,.2);white-space:nowrap}
th.sortable{cursor:pointer}
td{padding:7px 8px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);font-size:16px}
tr:nth-child(even) td{background:var(--zebra)}
tr.sel td{background:rgba(76,154,255,.28)!important}
tr{cursor:pointer}
.empty td{padding:34px;color:var(--muted)}
.note{max-width:150px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);text-decoration:underline dotted}
.th{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.epphoto{display:flex;flex-direction:column;gap:8px}
.epphoto .th{justify-content:flex-start;min-height:34px}
.epphoto .row{display:flex;gap:8px}
.note.sm{max-width:80px}.cnt{font-size:13px;color:var(--muted);cursor:pointer}
.th img,.pv img{width:30px;height:30px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);cursor:zoom-in}
.badge{padding:3px 10px;border-radius:99px;font-size:14px;font-weight:700;color:#fff}
.b-Paid{background:var(--ok)}.b-Partial{background:#d29922}.b-Due{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:260;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.mbox{background:var(--panel);color:var(--text);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:640px;padding:20px 22px;position:relative;margin:auto;backdrop-filter:blur(10px)}
[data-theme=violet] .mbox{background:#2a1f80}
[data-theme=peach] .mbox{background:#fff}
.mbox h3{margin:0 40px 14px 0;font-size:21px}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--panel2);cursor:pointer;font-size:20px;line-height:1}
.x:hover{background:var(--danger);color:#fff}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg .f{margin-bottom:0}
.fg .f.w{grid-column:1/-1}
.fg label{font-size:15px;color:var(--muted);font-weight:600}
.fg input[readonly]{background:var(--panel2);font-weight:700}
.mf{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pv .it{position:relative}
.pv .it button{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--danger);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.pv img{width:64px;height:64px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 16px}
.tm{height:54px;border-radius:12px;border:3px solid transparent;cursor:pointer;font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tm.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--text)}
.sec{margin:14px 0 6px;font-weight:700;font-size:17px}
.lr{display:flex;gap:8px;margin-bottom:8px}
.lr button{width:44px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#ss{margin-top:10px;font-size:15px;white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:10px;min-height:20px}
details{margin-top:14px}summary{cursor:pointer;font-weight:600}
#gsc{width:100%;height:170px;font-family:monospace;font-size:12px;margin-top:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:270;display:none;align-items:center;justify-content:center}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:8px}
#lb button{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:12px;z-index:280;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.notefull{white-space:pre-wrap;font-size:17px;line-height:1.6;word-break:break-word}
@media(max-width:800px){
 body.sb-open #main{margin-left:0}
 body.sb-open #bk{display:block}
 #page{padding:14px 10px 50px}
 #page.catp{padding-left:10px}
 .cards.sub{grid-template-columns:1fr}
 #top{padding:6px 8px}
 .fg{grid-template-columns:1fr}
 #pn{width:90px}
 .tw{max-height:none}
 .sf #q{width:100%}
 .sf{width:100%}
 .acts{width:100%}.acts .btn{flex:1}
 #rs{display:none}
}

.lt{display:flex;align-items:center;gap:8px;min-width:0}
.av.sm{width:68px;height:68px;font-size:30px;flex:none}
.pswitchwrap{position:relative;min-width:0}
.pswitch{background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;width:auto;white-space:nowrap;font-weight:800;font-size:17px;color:var(--text);cursor:pointer;max-width:50vw;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.pswitchmenu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;min-width:160px;max-width:70vw;overflow:auto;max-height:50vh}
.pswitchmenu.open{display:block}
.pswitchmenu .pmi{padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
.pswitchmenu .pmi:hover{background:var(--panel2)}
.pswitchmenu .pmi.on{color:var(--accent)}
.syncbadge{justify-self:end;font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:right;line-height:1.3;max-width:170px}
.syncbadge b{display:block;font-weight:700}
.syncbadge.ok{color:var(--ok);border-color:var(--ok)}
.syncbadge.err{color:var(--danger);border-color:var(--danger)}
@media(max-width:800px){.pswitch{max-width:38vw;font-size:13px;padding:6px 10px}.syncbadge{font-size:10px;max-width:92px;padding:5px 7px}.av.sm{width:48px;height:48px;font-size:22px}.tb h1{font-size:14px}.hsub{font-size:12px}}

#loginWrap{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#17213f,#2a2560);padding:18px;overflow:auto}
body.locked #loginWrap{display:flex}
body.locked #side,body.locked #main,body.locked #bk{display:none!important}
.lcard{background:#fff;color:#16213a;border-radius:18px;padding:24px 24px 20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto}
.lcard h2{margin:0 0 16px;text-align:center;font-size:21px;display:flex;align-items:center;justify-content:center;gap:8px}
.lcard label{display:block;font-size:14px;color:#44506a;margin:12px 0 4px;font-weight:600}
.lcard select,.lcard input[type=text],.lcard input[type=password]{width:100%;border:1px solid #cfd6e4;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:#16213a}
.lpinwrap{position:relative}
.lpinwrap button{position:absolute;right:6px;top:6px;background:none;border:none;font-size:19px;cursor:pointer;padding:4px}
.lbtn{width:100%;margin-top:16px;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}
.lbtn2{width:100%;margin-top:8px;background:#eef1f8;color:#2563eb;border:1px solid #cfd6e4;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}
.llinks{margin-top:14px;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:8px}
.llinks a{color:#2563eb;text-decoration:none;cursor:pointer}
.llinks .row2{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.lerr{color:#d7263d;font-size:13px;text-align:center;margin-top:8px;min-height:16px}
.rcbox{background:#eef1f8;color:#16213a;border:1px dashed #9fb0d1;border-radius:10px;padding:10px;margin:8px 0;text-align:center;font-family:monospace;font-size:19px;font-weight:700;letter-spacing:1px}

.setgrid{display:flex;flex-direction:column;gap:16px;max-width:1200px}
.setcard{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:18px 20px}
.setcard h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.setcard h3.colh{cursor:pointer;user-select:none;justify-content:space-between;padding:8px 6px;margin:-8px -6px 14px;border-radius:10px}
.setcard h3.colh:hover{background:var(--panel2)}
.colh .chev{margin-left:auto;color:var(--muted);font-size:14px}
.hdrbadge{margin-left:14px;font-size:13px;font-weight:600;color:var(--accent);background:var(--panel2);border-radius:99px;padding:3px 12px}
.colh:hover{color:var(--accent)}
.secbody{animation:none}
.activebadge{font-size:13px;color:var(--ok);background:rgba(63,185,80,.12);border:1px solid var(--ok);border-radius:99px;padding:5px 12px;font-weight:700}
.hlInput{font-size:19px!important;font-weight:800!important;background:var(--panel2)!important;border:2px solid var(--accent)!important}
.lpinwrap2{position:relative;display:flex}
.lpinwrap2 input{flex:1}
.eyebtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:17px;cursor:pointer;color:var(--muted)}
.bigchk{width:22px;height:22px;transform:scale(1.3);transform-origin:left center;margin-right:4px}
.setcard .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.fieldrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.fieldrow .f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.fieldrow label{font-size:13px;color:var(--muted);font-weight:600}
.swrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent}

/* House Making Cost Calculation — Apps Script backend
   Deploy: Deploy > New deployment > Web app > Execute as: Me, Who has access: Anyone.
   Copy the /exec URL into the dashboard's Settings & Backup > Google Sheet / Drive card.
   After any code change: Deploy > Manage deployments > Edit > Version: New version > Deploy. */

function baseFolder_(n){var i=DriveApp.getFoldersByName(n);return i.hasNext()?i.next():DriveApp.createFolder(n);}
function subFolder_(base,n){var i=base.getFoldersByName(n);return i.hasNext()?i.next():base.createFolder(n);}
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}

function membersFile_(base){
  var it=base.getFilesByName('members.json');
  if(it.hasNext())return it.next();
  var f=base.createFile('members.json','[]','application/json');
  return f;
}
function readMembers_(base){
  try{return JSON.parse(membersFile_(base).getBlob().getDataAsString())}catch(e){return []}
}
function writeMembers_(base,arr){membersFile_(base).setContent(JSON.stringify(arr));}

function doGet(e){
  try{
    var p=(e&&e.parameter)||{};
    var base=baseFolder_(p.folder||'HouseCost');
    if(p.action=='members')return out_({ok:true,members:readMembers_(base)});
    if(p.action=='load'){
      if(!p.profile)return out_({ok:false,msg:'profile missing'});
      var sf=subFolder_(base,p.profile);
      var it=sf.getFilesByName('house_data.json');
      if(!it.hasNext())return out_({ok:false,msg:'No saved data for this profile yet'});
      return out_({ok:true,data:JSON.parse(it.next().getBlob().getDataAsString())});
    }
    return out_({ok:true,msg:'Connected. Folder: '+base.getName()});
  }catch(err){return out_({ok:false,msg:String(err)});}
}

function doPost(e){
  try{
    var b=JSON.parse(e.postData.contents);
    var base=baseFolder_(b.folder||'HouseCost');

    if(b.memberRecord){
      var arr=readMembers_(base),rec=b.memberRecord,found=false;
      for(var i=0;i<arr.length;i++){if(arr[i].name===rec.name){arr[i]=rec;found=true;break;}}
      if(!found)arr.push(rec);
      writeMembers_(base,arr);
    }
    if(b.deleteProfile){
      var arr2=readMembers_(base).filter(function(m){return m.name!==b.deleteProfile});
      writeMembers_(base,arr2);
    }
    if(b.profile&&b.data){
      var sf=subFolder_(base,b.profile);
      var s=JSON.stringify(b.data),it=sf.getFilesByName('house_data.json');
      if(it.hasNext())it.next().setContent(s);else sf.createFile('house_data.json',s,'application/json');

      var fs=sf.getFilesByName('HouseCost Sheet'),ss;
      if(fs.hasNext())ss=SpreadsheetApp.openById(fs.next().getId());
      else{ss=SpreadsheetApp.create('HouseCost Sheet');DriveApp.getFileById(ss.getId()).moveTo(sf);}
      (b.sheets||[]).forEach(function(t){
        var sh=ss.getSheetByName(t.name)||ss.insertSheet(t.name);
        sh.clear();
        var n=t.head.length,rows=[t.head].concat(t.rows);
        var all=sh.getRange(1,1,rows.length,n);
        all.setValues(rows);
        all.setWrapStrategy(SpreadsheetApp.WrapStrategy.CLIP)
           .setVerticalAlignment('middle').setHorizontalAlignment('center')
           .setBorder(true,true,true,true,true,true,'#9aa5b1',SpreadsheetApp.BorderStyle.SOLID);
        sh.getRange(1,1,1,n).setBackground('#1f4d8f').setFontColor('#ffffff').setFontWeight('bold');
        sh.setFrozenRows(1);
        sh.setColumnWidths(1,n,120);
        sh.setRowHeights(1,rows.length,28);
      });
      var d=ss.getSheetByName('Sheet1');
      if(d&&ss.getSheets().length>1)ss.deleteSheet(d);
    }
    return out_({ok:true,msg:'Saved'});
  }catch(err){return out_({ok:false,msg:String(err)});}
}
</script>

function fd(d,fmtOverride){
 if(!d)return'';
 const p=d.split('-');if(p.length!==3)return d;
 const[y,m,dd]=p,fmtS=fmtOverride||(typeof S!=='undefined'&&S.dateFmt)||'dmy';
 if(fmtS==='iso')return y+'-'+m+'-'+dd;
 if(fmtS==='mdy')return m+'-'+dd+'-'+y;
 if(fmtS==='dmy2')return dd+' '+MON[(+m)-1]+' '+y;
 return dd+'-'+m+'-'+y;

function aggregate(q,from,to){
 const toks=q.toLowerCase().split(/\s+/).filter(Boolean);let n=0,qty=0,sub=0,carry=0;const dates=new Set();
 Object.keys(KW).forEach(k=>{const def=L[k];DB[k].forEach(r=>{
  const d=r.date||'';if(from&&d<from)return;if(to&&d>to)return;
  const hay=(KW[k]+' '+def.card+' '+def.title+' '+(r.q||'')+' '+(r.name||'')).toLowerCase();
  if(!toks.every(t=>hay.includes(t)))return;
  n++;dates.add(d);qty+=k==='wood'?N(r.tcft):k==='labour'?N(r.day):N(r.qty);sub+=N(r.sub);carry+=k==='labour'?0:N(r.carry);if(k==='labour')sub+=N(r.total)-N(r.sub)})});
 return{n,qty:r2(qty),sub:r2(sub),carry:r2(carry),total:r2(sub+carry),date:dates.size===1?[...dates][0]:''};
}

  m.querySelector('#pdl').style.display=p.length?'':'none';refreshAny(key)};
 m.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.nv){i=(i+ +t.dataset.nv+r.photos.length)%r.photos.length;draw()}
  if(t.dataset.k!==undefined&&t.tagName==='IMG'){i=+t.dataset.k;draw()}
  if(t.id==='pup')m.querySelector('#pfi').click();

 draw();

async function doLogin(){
 const name=$('#lsel').value,pin=$('#lpin').value.trim();
 if(!pin)return $('#lerr').textContent='PIN দিন';
 const prof=findProfile(name);
 if(!prof)return $('#lerr').textContent='প্রোফাইল পাওয়া যায়নি';
 const h=await sha256((prof.salt||name.toLowerCase())+':'+pin);
 if(h!==prof.pinHash)return $('#lerr').textContent='❌ ভুল PIN';
 $('#lerr').textContent='';
 G._last=name;saveG();
 await loadProfileLocal(name);
 sessionStorage.setItem('hc_session',name);
 unlockScreen();
 bootApp();
 toast('স্বাগতম, '+name);
 if(links_().length)runSync(true);
}

 const m=modal(`<h3>🔗 Google সংযোগ</h3>
 <div class="f" style="margin-bottom:10px"><label>ড্রাইভ ফোল্ডারের নাম</label><input type="text" id="cgf" value="${esc(G.folder)}"></div>
 <div class="f"><label>Apps Script Web App URL</label><input type="text" id="cgs" value="${esc(G.script)}" placeholder="https://script.google.com/macros/s/.../exec"></div>
 <div class="mf"><button class="btn" data-x="1">Cancel</button><button class="btn pri" id="cgsv">সেভ</button></div>`);

async function fetchMembersFromServer(){
 if(!G.script)return openConnectGoogle();
 toast('সদস্য তালিকা আনা হচ্ছে...');
 try{
  const r=await fetch(G.script+'?action=members&folder='+encodeURIComponent(G.folder));
  const j=await r.json();
  if(!j.ok)return toast('❌ '+(j.msg||'ব্যর্থ'));
  (j.members||[]).forEach(m=>{const ex=findProfile(m.name);if(ex)Object.assign(ex,m);else PROFILES.push(m)});
  savePROFILES();renderLogin();toast('✅ সদস্য তালিকা আপডেট হয়েছে ('+(j.members||[]).length+' জন)')
 }catch(e){toast('❌ কানেক্ট হয়নি')}
}

function openNewProfile(fromLogin){
 const m=modal(`<h3>+ নতুন প্রোফাইল</h3>
 <div class="f"><label>নাম</label><input type="text" id="npname"></div>
 <div class="f"><label>PIN</label><div class="lpinwrap2"><input type="password" inputmode="numeric" id="npin1"><button class="eyebtn" data-eye="npin1">👁</button></div></div>
 <div class="f"><label>PIN আবার লিখুন</label><div class="lpinwrap2"><input type="password" inputmode="numeric" id="npin2"><button class="eyebtn" data-eye="npin2">👁</button></div></div>
 <div class="lerr" id="nperr"></div>
 <div class="mf"><button class="btn" data-x="1">Cancel</button><button class="btn pri" id="npgo">তৈরি করুন</button></div>`);
 m.querySelector('.mbox').style.maxWidth='320px';
 m.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=m.querySelector('#'+b.dataset.eye);i.type=i.type==='password'?'text':'password'});
 var CURP_BEFORE=CURP;
 m.querySelector('#npgo').onclick=async()=>{
  const name=m.querySelector('#npname').value.trim(),p1=m.querySelector('#npin1').value,p2=m.querySelector('#npin2').value,err=m.querySelector('#nperr');
  if(!name)return err.textContent='নাম দিন';
  if(findProfile(name))return err.textContent='এই নামে প্রোফাইল আছে';
  if(!p1||p1.length<4)return err.textContent='কমপক্ষে ৪ সংখ্যার PIN দিন';
  if(p1!==p2)return err.textContent='PIN মিলছে না';
  const code=randCode();
  const salt=randSalt();
  const pinHash=await sha256(salt+':'+p1);
  const recHash=await sha256(salt+':R:'+code);
  const rec={name,salt,pinHash,recovery:recHash,photo:'',dob:''};
  m.remove();
  showRecoveryCode(code,async()=>{
   PROFILES.push(rec);savePROFILES();
   S=defaultS();DB={};CURP=name;ensureDBShape();saveS();saveDB();
   pushMemberRecord(rec);
   if(fromLogin){
    G._last=name;saveG();sessionStorage.setItem('hc_session',name);unlockScreen();bootApp();toast('প্রোফাইল তৈরি হয়েছে, স্বাগতম '+name);
   }else{
    toast('নতুন সদস্য যোগ হয়েছে: '+name);await loadProfileLocal(CURP_BEFORE);renderPage();
   }
  });
 };
}

function openForgotPin(name){
 const m=modal(`<h3>🔑 PIN রিকভার করুন</h3>
 <div class="f"><label>প্রোফাইল</label><select id="fpn">${PROFILES.map(p=>`<option ${p.name===name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="f"><label>রিকভারি PIN</label><input type="text" id="fc1" placeholder="কোড লিখুন"></div>
 <div class="f"><label>নতুন PIN</label><div class="lpinwrap2"><input type="password" inputmode="numeric" id="fp1"><button class="eyebtn" data-eye="fp1">👁</button></div></div>
 <div class="f"><label>নতুন PIN আবার</label><div class="lpinwrap2"><input type="password" inputmode="numeric" id="fp2"><button class="eyebtn" data-eye="fp2">👁</button></div></div>
 <div class="lerr" id="fperr"></div>
 <div class="mf"><button class="btn" data-x="1">Cancel</button><button class="btn pri" id="fpgo">PIN বদলান</button></div>`);
 m.querySelector('.mbox').style.maxWidth='340px';
 m.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=m.querySelector('#'+b.dataset.eye);i.type=i.type==='password'?'text':'password'});
 m.querySelector('#fpgo').onclick=async()=>{
  const nm=m.querySelector('#fpn').value,err=m.querySelector('#fperr');
  const prof=findProfile(nm);if(!prof)return err.textContent='প্রোফাইল পাওয়া যায়নি';
  const code=m.querySelector('#fc1').value.trim();
  const h=await sha256((prof.salt||nm.toLowerCase())+':R:'+code.toUpperCase());
  if(h!==prof.recovery)return err.textContent='❌ কোড মিলছে না';
  const p1=m.querySelector('#fp1').value,p2=m.querySelector('#fp2').value;
  if(!p1||p1.length<4)return err.textContent='কমপক্ষে ৪ সংখ্যার PIN দিন';
  if(p1!==p2)return err.textContent='PIN মিলছে না';
  prof.pinHash=await sha256((prof.salt||nm.toLowerCase())+':'+p1);
  savePROFILES();pushMemberRecord(prof);
  m.remove();toast('✅ PIN বদলানো হয়েছে, এখন লগইন করুন');renderLogin(nm);
 };
}

function ageFromDob(dob){
 if(!dob)return'';
 const b=new Date(dob+'T00:00:00'),t=new Date();
 let a=t.getFullYear()-b.getFullYear();
 if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;
 return a>=0?a:'';
}

async function renameProfile(newName){
 newName=newName.trim();
 if(!newName||newName===CURP)return;
 if(findProfile(newName))return toast('এই নামে প্রোফাইল আগে থেকেই আছে');
 const prof=findProfile(CURP);
 try{
  const sO=localStorage.getItem('hc_S_'+CURP),dO=localStorage.getItem('hc_D_'+CURP);
  if(sO)localStorage.setItem('hc_S_'+newName,sO);
  if(dO)localStorage.setItem('hc_D_'+newName,dO);
  if(idb.db){const d=await idb.get('d_'+CURP);if(d)await idb.set('d_'+newName,d)}
  localStorage.removeItem('hc_S_'+CURP);localStorage.removeItem('hc_D_'+CURP);
 }catch(e){}
 prof.name=newName;savePROFILES();
 sessionStorage.setItem('hc_session',newName);
 G._last=newName;saveG();
 CURP=newName;
 pushMemberRecord(prof);
 applyTopbar();renderSettings();
 toast('✅ নাম বদলানো হয়েছে');
}

/* ---------- app name/icon download ---------- */
function makeIconCanvas(size){
 const c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d');
 const r=size*0.22;ctx.fillStyle=G.iconColor;
 ctx.beginPath();ctx.moveTo(r,0);ctx.arcTo(size,0,size,size,r);ctx.arcTo(size,size,0,size,r);ctx.arcTo(0,size,0,0,r);ctx.arcTo(0,0,size,0,r);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.font=(size*0.5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(G.iconChar||'🏠',size/2,size/2+size*0.04);
 return c;
}
function dl(name,url){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
async function downloadAppFiles(){
 $('#saapply').click();
 const man={name:G.appName,short_name:G.shortName,start_url:'./index.html',scope:'./',display:'standalone',background_color:'#22272e',theme_color:'#22272e',
  icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
 dl('manifest.webmanifest',URL.createObjectURL(new Blob([JSON.stringify(man,null,2)],{type:'application/json'})));
 dl('icon-192.png',makeIconCanvas(192).toDataURL('image/png'));
 dl('icon-512.png',makeIconCanvas(512).toDataURL('image/png'));
 dl('index.html',URL.createObjectURL(new Blob([document.documentElement.outerHTML],{type:'text/html'})));
 toast('ফাইলগুলো ডাউনলোড হচ্ছে — সবগুলো একসাথে GitHub-এ আপলোড করুন');
}

 const net=conn?(conn.type||conn.effectiveType||'অজানা'):'অজানা';

}

function photoCell_(urls){
 urls=urls||[];
 if(!urls.length)return'';
 const label=(urls.length>1?('📷 '+urls.length+' ছবি'):'📷 ছবি').replace(/"/g,"'");
 return '=HYPERLINK("'+urls[0]+'","'+label+'")';
}
function payload(){
 const sheets=Object.keys(L).map(k=>{const def=L[k],fs=def.fields,{all}=view(k);
  return{name:def.title.slice(0,90),head:fs.map(f=>f.l),rows:all.map(r=>fs.map(f=>{
   if(f.t==='sn')return r._sn;
   if(f.t==='photo')return photoCell_(r.photoUrls);
   return r[f.k]??'';
  }))}});
 sheets.push({name:'Notepad',head:['No','Date','Title','Note','Photo'],rows:DB.notes.slice().sort((a,b)=>a.id-b.id).map((n,i)=>[i+1,n.date,n.title,stripHtml(n.html).slice(0,500),photoCell_(n.photoUrls)])});
 return{folder:G.folder,profile:CURP,data:{v:2,names:S.names,db:DB},sheets};
}

async function uploadPhotoToDrive(dataUrl,card,filename){
 if(!G.script)return null;
 try{
  const r=await fetch(G.script,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({folder:G.folder,uploadPhoto:{profile:CURP,card,filename,dataUrl}})});
  const j=await r.json();
  return j.ok?j.url:null;
 }catch(e){return null}
}
async function saveDBraw(){try{if(idb.db)await idb.set('d_'+CURP,DB);else localStorage.setItem('hc_D_'+CURP,JSON.stringify(DB))}catch(e){}}
async function ensurePhotoUrls(){
 let changed=false;
 for(const key of Object.keys(L)){
  const def=L[key];
  if(!def.fields.some(f=>f.t==='photo'))continue;
  for(const row of (DB[key]||[])){
   row.photoUrls=row.photoUrls||[];
   while(row.photoUrls.length<(row.photos||[]).length){
    const idx=row.photoUrls.length;
    const url=await uploadPhotoToDrive(row.photos[idx],def.card,'SN'+row.id+'_'+(idx+1)+'.jpg');
    if(!url)break;
    row.photoUrls.push(url);changed=true;
   }
  }
 }
 for(const row of (DB.notes||[])){
  row.photoUrls=row.photoUrls||[];
  while(row.photoUrls.length<(row.photos||[]).length){
   const idx=row.photoUrls.length;
   const url=await uploadPhotoToDrive(row.photos[idx],'Notepad','N'+row.id+'_'+(idx+1)+'.jpg');
   if(!url)break;
   row.photoUrls.push(url);changed=true;
  }
 }
 if(changed)await saveDBraw();
 return changed;
}
function mergeServerDB(serverDB){
 if(!serverDB)return;
 const tomb=DB._tomb=DB._tomb||{};
 Object.keys(serverDB._tomb||{}).forEach(k=>{if((serverDB._tomb[k]||0)>(tomb[k]||0))tomb[k]=serverDB._tomb[k]});
 Object.keys(L).forEach(key=>{
  const serverRows=serverDB[key]||[],localRows=DB[key]||[],map={};
  localRows.forEach(r=>map[r.id]=r);
  serverRows.forEach(sr=>{const lr=map[sr.id];if(!lr||(sr._t||0)>(lr._t||0))map[sr.id]=sr});
  Object.keys(map).forEach(id=>{if((tomb[key+':'+id]||0)>=(map[id]._t||0))delete map[id]});
  DB[key]=Object.values(map);
 });
 {
  const map={};
  (DB.notes||[]).forEach(r=>map[r.id]=r);
  (serverDB.notes||[]).forEach(sr=>{const lr=map[sr.id];if(!lr||(sr._t||0)>(lr._t||0))map[sr.id]=sr});
  Object.keys(map).forEach(id=>{if((tomb['notes:'+id]||0)>=(map[id]._t||0))delete map[id]});
  DB.notes=Object.values(map);
 }
}

async function diag(u,err){
 const tips='\n   ➤ Deploy → Manage deployments → ✏️ → Who has access = "Anyone" (Anyone with Google account নয়)\n   ➤ কোড বদলালে: Version = "New version" দিয়ে Deploy করুন\n   ➤ Script এডিটরে doGet Run করে Authorize (Allow) করুন\n   ➤ লিঙ্ক অবশ্যই /exec দিয়ে শেষ হবে';
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u))return '❌ লিঙ্ক ভুল — https://script.google.com/macros/s/.../exec ফরম্যাট হতে হবে';
 if(err instanceof SyntaxError)return '❌ সার্ভার JSON দেয়নি (সম্ভবত লগইন পেজ এসেছে)'+tips;
 try{await fetch(u,{mode:'no-cors'});return '❌ সার্ভার পাওয়া গেছে কিন্তু উত্তর পড়া যায়নি ('+err.message+')'+tips}catch(_){return '❌ সার্ভারে পৌঁছানো যায়নি — ইন্টারনেট/VPN/ফায়ারওয়াল চেক করুন ('+err.message+')'}
}
async function diagSend(u,err,body){
 if(err instanceof SyntaxError||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u))return diag(u,err);
 try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});return '⚠️ পাঠানো হয়েছে কিন্তু নিশ্চিত হওয়া যায়নি'}catch(_){return diag(u,err)}
}

let syncT,syncing=false,syncAgain=false;
function setSyn(t,cls){
 const e=$('#syn');if(e){e.innerHTML=t;e.className='syncbadge'+(cls?' '+cls:'')}
 const g=$('#sgst');if(g&&t)g.textContent=stripHtml(t);
}
function networkOk(){
 if(G.syncNet!=='wifi')return true;
 const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
 if(!conn)return true; // can't detect — allow
 return conn.type?conn.type==='wifi':true;
}
function autoSyncSoon(){
 if(!CURP||!G.autoSync||!links_().length||!networkOk())return;
 clearTimeout(syncT);setSyn('⏳ সিঙ্কের অপেক্ষায়...');syncT=setTimeout(()=>runSync(false),3000);
}
async function pullOnce_(){
 const u=G.script;
 const r=await fetch(u+'?action=load&folder='+encodeURIComponent(G.folder)+'&profile='+encodeURIComponent(CURP));
 const j=await r.json(); // throws on non-JSON response (e.g. an auth/consent page)
 return j;
}
async function runSync(manual){
 if(!CURP||!links_().length){setSyn('');return}
 if(syncing){syncAgain=true;return}
 syncing=true;setSyn('<b>🔄 সিঙ্ক হচ্ছে...</b>ডাটা আনা হচ্ছে...');
 const u=G.script;
 let pullOk=false,pullErr=null;
 for(let attempt=0;attempt<2&&!pullOk;attempt++){
  try{
   const pj=await pullOnce_();
   if(pj.ok&&pj.data&&pj.data.db){mergeServerDB(pj.data.db);await saveDBraw();ensureDBShape()}
   pullOk=true; // "no saved data yet" (pj.ok:false, first sync for this profile) also counts as pullOk — nothing to merge, safe to proceed
  }catch(pe){pullErr=pe;if(attempt===0)await new Promise(res=>setTimeout(res,1200))}
 }
 if(!pullOk){
  // Could not confirm the server's current data — refuse to push, to avoid silently erasing another device's rows.
  setSyn('<b>⚠️ সিঙ্ক স্থগিত</b>সার্ভারের ডাটা যাচাই করা যায়নি, তাই পাঠানো হয়নি — আবার চেষ্টা করুন','err');
  syncing=false;
  if(syncAgain){syncAgain=false;autoSyncSoon()}
  return;
 }
 try{
  setSyn('<b>📤 আপলোড হচ্ছে...</b>ছবি চেক হচ্ছে');
  await ensurePhotoUrls();
  setSyn('<b>📡 ডাটা ট্রান্সফার হচ্ছে...</b>পাঠানো হচ্ছে');
  const body=JSON.stringify(payload());
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  const j=await r.json();
  if(j.ok){
   const t=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
   setSyn('<b>✓ ডাটা পাঠানো ও আনা হয়েছে</b>'+t,'ok');
   if(typeof UI!=='undefined'&&UI.page)renderPage();
   renderSide();
  }else setSyn('<b>✕ সিঙ্ক ব্যর্থ</b>'+(j.msg||''),'err');
 }catch(err){setSyn('<b>✕ সিঙ্ক ব্যর্থ</b>ইন্টারনেট চেক করুন','err')}
 syncing=false;
 if(syncAgain){syncAgain=false;autoSyncSoon()}
}
if(!window.__synClickBound){window.__synClickBound=true;document.addEventListener('click',e=>{if(e.target.closest('#syn'))runSync(true)})}
